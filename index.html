<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallet Pass Creator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Wallet Pass Creator</h1>
      <div class="card">
        <input id="url_input" placeholder="Enter a link" type="text" />
        <button class="pass">Create Pass</button>
        <div class="pass-preview">
          <input class="color-picker" type="color" value="#ff0000" />
          <div class="pass-js"></div>
        </div>
      </div>
    </div>

    <!-- =====footer===== -->
    <footer class="footer">
      <p>&copy; 2026 Wallet Pass Creator. All rights reserved.</p>
      <p>Designed by Seyar Omari, Elliot Fielding and Maxwell Bridgeman.</p>
      <p>Desined for Hackabury 2026.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
